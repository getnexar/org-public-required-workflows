name: secret-scan

# The job declares the constant true condition.  GitHub documents that a
# required-check job skipped by a conditional reports "Success" without
# running, so a conditional on this job could drop the scan silently.
# The constant condition keeps the job running on every trigger.  This is
# the chosen mechanism; other documented controls exist and are not used
# here.  The exact actionlint message is exempted narrowly in
# .github/actionlint.yaml.  Source:
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    if: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The commit range below needs both endpoints present, so a shallow
          # clone will not do.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          ARCHIVE_SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          curl -sSfL -o "${RUNNER_TEMP}/${ARCHIVE}" "$URL"
          actual="$(sha256sum "${RUNNER_TEMP}/${ARCHIVE}" | awk '{print $1}')"
          if [ "$actual" != "$ARCHIVE_SHA256" ]; then
            echo "::error::The downloaded gitleaks archive did not match its pinned checksum; refusing to install it."
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          rm -f "${RUNNER_TEMP}/${ARCHIVE}"
          gitleaks version

      - name: Pin the gitleaks ruleset outside the scanned repository
        run: |
          set -euo pipefail
          # This release composes the pinned default ruleset with no
          # per-repository allowlist.  A repository-supplied config or
          # environment variable cannot select or extend it: the config is
          # written to RUNNER_TEMP, outside --source, and passed explicitly.
          #
          # The canary validates expected fixture and rule identities, not an
          # arbitrary finding count.  It refuses a missing, empty, malformed or
          # stale report and refuses when the pinned rules did not load.  A
          # mistyped ruleset key therefore cannot pass in silence.
          unset GITLEAKS_CONFIG || true
          CONFIG="${RUNNER_TEMP}/gitleaks-pinned.toml"
          printf '[extend]\nuseDefault = true\n\n' > "$CONFIG"

          CANARY="${RUNNER_TEMP}/canary"
          # Cleared, not only created: a surviving report from an earlier job
          # must not satisfy the freshness check below.
          rm -rf "$CANARY"
          mkdir -p "$CANARY"
          started="$(date +%s)"
          # The fake values are assembled at run time from short fragments so
          # this workflow file itself never carries a contiguous credential.
          {
            printf '%s%s%s%s%s\n' 'AKIA' 'IOSF' 'ODNN' '7REA' 'LKEY'
            printf 'aws_secret_access_key = "%s%s%s%s%s"\n' \
              'kR9x2LmQ' '8vTn4WpZ' '6yBc1DfG' 'hJ3sAe5U' 'vXo7Nq0M'
          } > "$CANARY/planted.txt"
          canary_status=0

          gitleaks detect --no-git --source "$CANARY" --config "$CONFIG" \
            --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$CANARY/report.json" \
            >/dev/null 2>"$CANARY/err.txt" || canary_status=$?
          # A nonzero gitleaks status is refused even when --exit-code 0 and the
          # report carries matching rule identities: the run itself failed.
          if [ "$canary_status" -ne 0 ]; then
            echo "::error::the canary gitleaks run exited ${canary_status}; refusing to scan because the pinned ruleset could not be verified."
            echo "--- gitleaks stderr ---"
            cat "$CANARY/err.txt" || true
            rm -rf "$CANARY"
            exit 1
          fi

          python3 -I - "$CANARY/report.json" "$CANARY/planted.txt" "$started" <<'PYCANARY'
          import json
          import os
          import sys

          REQUIRED = (
              ("planted.txt", "aws-access-token"),
              ("planted.txt", "generic-api-key"),
          )
          report, fixture, started = sys.argv[1], sys.argv[2], sys.argv[3]
          name = os.path.basename(fixture)
          fixture_real = os.path.realpath(fixture)
          fixture_dir = os.path.dirname(os.path.abspath(fixture))


          def is_expected_fixture(path):
              if os.path.isabs(path):
                  candidates = [path]
              else:
                  candidates = [
                      os.path.join(fixture_dir, path),
                      os.path.join(os.getcwd(), path),
                  ]
              return any(
                  os.path.realpath(item) == fixture_real for item in candidates
              )


          def refuse(message):
              sys.stderr.write("canary refused: " + message + "\n")
              sys.exit(1)


          if not os.path.isfile(report):
              refuse("the canary report is missing")
          if os.path.getsize(report) == 0:
              refuse("the canary report is empty")
          try:
              if int(os.path.getmtime(report)) < int(started):
                  refuse("the canary report is stale")
          except OSError:
              refuse("the canary report has no readable timestamp")
          try:
              with open(report, encoding="utf-8") as handle:
                  document = json.load(handle)
          except (OSError, ValueError):
              refuse("the canary report is malformed")
          if not isinstance(document, list):
              refuse("the canary report is malformed")

          observed = set()
          for entry in document:
              if not isinstance(entry, dict):
                  refuse("a canary report entry is malformed")
              rule = entry.get("RuleID")
              path = entry.get("File")
              if not isinstance(rule, str) or not rule:
                  refuse("a canary finding is missing its rule identity")
              if not isinstance(path, str) or not path:
                  refuse("a canary finding is missing its fixture path")
              if is_expected_fixture(path):
                  observed.add((name, rule))

          missing = [pair for pair in REQUIRED if pair not in observed]
          if missing:
              refuse(
                  "the pinned ruleset did not detect the expected fixture and "
                  "rule identities: " + ", ".join(rule for _fixture, rule in missing)
              )
          sys.stdout.write("canary: pinned ruleset fixture and rule identities verified\n")
          PYCANARY

          rm -rf "$CANARY"
          echo "GITLEAKS_PINNED_CONFIG=${CONFIG}" >> "$GITHUB_ENV"
          echo "pinned default ruleset composed (no per-repository exceptions)"

      - name: Neutralise repository-supplied suppression files
        run: |
          set -euo pipefail
          # Working-tree neutralisation: this release removes the
          # working-tree copy so gitleaks does not read .gitleaksignore
          # from the scanned checkout.  No --gitleaks-ignore-path or other
          # suppression path argument is passed.  The file stays in history
          # and the scanned commit range is unchanged.
          if [ -f .gitleaksignore ]; then
            echo "::warning::.gitleaksignore is present and is ignored for this scan."
            rm -f .gitleaksignore
          fi
          if [ -f .gitleaks.toml ]; then
            echo "::warning::.gitleaks.toml is present and is NOT used: this scan runs a pinned default ruleset. Request a reviewed allowlist through your security process instead."
          fi

      - name: Reject an empty or unresolved commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A required workflow can also be called through workflow_call with
          # no inputs.  An empty or unresolvable range must refuse rather than
          # pass zero commits.
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "::error::The pull-request commit range is unset (BASE/HEAD); refusing to scan."
            exit 2
          fi
          # A failed command refuses even when it printed a number; the
          # status is preserved instead of masked with || true.
          if ! count="$(git rev-list --count "${BASE}..${HEAD}" 2>/dev/null)"; then
            echo "::error::The commit range ${BASE}..${HEAD} could not be resolved; refusing to scan."
            exit 2
          fi
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::The commit range ${BASE}..${HEAD} could not be resolved; refusing to scan."
              exit 2
              ;;
          esac
          if [ "$count" -eq 0 ]; then
            echo "::error::The commit range ${BASE}..${HEAD} contains no commits; refusing to scan."
            exit 2
          fi

      - name: Scan only the commits this pull request introduces
        id: scan
        env:
          GITLEAKS_CONFIG: ""
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Deliberately a commit RANGE and not a full-history scan. Scanning history
          # would fail every pull request in a repository that already carries a
          # historical secret. This gate is about not adding new ones. The existing
          # ones are a separate sweep.
          #
          # Acquisition keeps the measured hardening: text mode, no external diff, no
          # textconv, no rename detection, first-parent merge diffs. first-parent alone
          # re-adds content inherited from the target base at a clean merge, so each
          # merge finding is attributed to its direct parents below before the gate
          # decides. A finding is dropped only when the same path and line span are
          # proven inherited unchanged from at least one direct parent. See
          # docs/acquisition.md.
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "::error::The pull-request commit range is unset (BASE/HEAD); refusing to scan."
            echo "result=tool-error" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 2
          fi

          WORK="$(mktemp -d "${RUNNER_TEMP%/}/secret-scan.XXXXXX")"
          chmod 700 "$WORK"
          trap 'rm -rf "$WORK"' EXIT
          REPORT="$WORK/gitleaks.json"
          RECEIPT="$WORK/git-receipt.txt"
          SHIM_DIR="$WORK/path"
          SHIM_TMP="$WORK/tmp"
          mkdir -p "$SHIM_DIR" "$SHIM_TMP"

          # Capture the runner's real Git before the receipt wrapper changes PATH.
          REAL_GIT="$(command -v git)"
          export SCANNER_REAL_GIT="$REAL_GIT"
          export SCANNER_RECEIPT="$RECEIPT"
          export SCANNER_SHIM_TMP="$SHIM_TMP"

          # Trusted receipt wrapper. Gitleaks resolves `git` from PATH for the
          # historical patch. The wrapper records START then DONE with the return
          # status and stderr size for the actual acquisition calls, so a silent Git
          # failure cannot read as a clean scan. Only status metadata enters the
          # receipt; Git stderr stays in private captures removed on exit.
          cat > "$SHIM_DIR/git" <<'SHIM'
          #!/usr/bin/env bash
          receipt="${SCANNER_RECEIPT:?}"
          real="${SCANNER_REAL_GIT:?}"
          sub=""
          prev=""
          for arg in "$@"; do
            if [ -n "$prev" ]; then
              prev=""
              continue
            fi
            case "$arg" in
              -C|--git-dir|--work-tree|-c)
                prev="$arg"
                continue
                ;;
              --*)
                continue
                ;;
              *)
                sub="$arg"
                break
                ;;
            esac
          done
          kind=metadata
          case "$sub" in
            log)
              kind=log
              ;;
            cat-file)
              kind=cat-file
              ;;
          esac
          if [ "$kind" = metadata ]; then
            exec "$real" "$@"
          fi
          errfile="$(mktemp "${SCANNER_SHIM_TMP:?}/err.XXXXXX")"
          printf 'START %s\n' "$kind" >> "$receipt"
          "$real" "$@" 2>"$errfile"
          rc=$?
          bytes=0
          if [ -s "$errfile" ]; then
            bytes=$(wc -c < "$errfile" | tr -d ' ')
          fi
          printf 'DONE %s rc=%s err=%s\n' "$kind" "$rc" "$bytes" >> "$receipt"
          if [ "$bytes" -gt 0 ]; then
            cat "$errfile" >&2
          fi
          rm -f "$errfile"
          exit "$rc"
          SHIM
          chmod 700 "$SHIM_DIR/git"
          export PATH="$SHIM_DIR:$PATH"

          gl_rc=0
          gitleaks detect \
            --source . \
            --config "${GITLEAKS_PINNED_CONFIG}" \
            --log-opts "${BASE}..${HEAD} --text --no-ext-diff --no-textconv --no-renames --diff-merges=first-parent" \
            --redact \
            --no-banner \
            --exit-code 0 \
            --report-format json \
            --report-path "$REPORT" \
            >"$WORK/gitleaks.out" 2>"$WORK/gitleaks.err" || gl_rc=$?
          if [ "$gl_rc" -ne 0 ]; then
            echo "::error::The pinned Gitleaks invocation failed (status ${gl_rc}); refusing to read this as a clean scan."
            echo "result=tool-error" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 2
          fi

          scanned=""
          if [ -s "$WORK/gitleaks.err" ]; then
            scanned="$(grep -oE '[0-9]+ commits scanned' "$WORK/gitleaks.err" | tail -n 1 | grep -oE '^[0-9]+' || true)"
          fi
          echo "gitleaks: ${scanned:-0} commits scanned (first-parent acquisition)"

          # Attribute the findings. python3 -I ignores PYTHONPATH, user site-packages
          # and the current directory, so a scanned repository cannot shadow json,
          # subprocess or a sitecustomize module.
          set +e
          python3 -I - "$REPORT" "$RECEIPT" "$REAL_GIT" "$BASE" "$HEAD" <<'PYSCAN'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          EXIT_OK = 0
          EXIT_CREDENTIAL = 10
          EXIT_ACQUISITION = 2
          EXIT_REPORT = 3

          HUNK = re.compile(rb"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@")


          def fail(code, reason):
              sys.stderr.write("scan refused: " + reason + "\n")
              sys.exit(code)


          def git(args):
              return subprocess.run([real_git, "--literal-pathspecs"] + args, capture_output=True)


          def text(data):
              return data.decode("utf-8", "replace")


          def check_receipt(path):
              try:
                  raw = Path(path).read_text(encoding="utf-8", errors="replace")
              except OSError:
                  fail(EXIT_ACQUISITION, "acquisition receipt missing")
              pending = []
              completed = []
              for line in raw.splitlines():
                  fields = line.split()
                  if not fields:
                      continue
                  if fields[0] == "START" and len(fields) == 2:
                      pending.append(fields[1])
                      continue
                  if fields[0] == "DONE" and len(fields) == 4:
                      kind = fields[1]
                      if not fields[2].startswith("rc=") or not fields[3].startswith("err="):
                          fail(EXIT_ACQUISITION, "acquisition receipt malformed")
                      try:
                          code = int(fields[2][3:])
                          int(fields[3][4:])
                      except ValueError:
                          fail(EXIT_ACQUISITION, "acquisition receipt malformed")
                      if kind not in pending:
                          fail(EXIT_ACQUISITION, "acquisition receipt malformed")
                      pending.remove(kind)
                      completed.append((kind, code))
                      continue
                  fail(EXIT_ACQUISITION, "acquisition receipt malformed")
              if pending:
                  fail(EXIT_ACQUISITION, "acquisition receipt incomplete")
              logs = [code for kind, code in completed if kind == "log"]
              if not logs:
                  fail(EXIT_ACQUISITION, "acquisition receipt records no Git log call")
              if any(code != 0 for code in logs):
                  fail(EXIT_ACQUISITION, "Git acquisition log failed")
              if any(code != 0 for kind, code in completed if kind == "cat-file"):
                  fail(EXIT_ACQUISITION, "Git acquisition cat-file failed")


          def load_report(path):
              try:
                  raw = Path(path).read_bytes()
              except OSError:
                  fail(EXIT_REPORT, "scanner report missing")
              if not raw:
                  fail(EXIT_REPORT, "scanner report empty")
              try:
                  document = json.loads(raw.decode("utf-8"))
              except (UnicodeDecodeError, ValueError):
                  fail(EXIT_REPORT, "scanner report malformed")
              if not isinstance(document, list):
                  fail(EXIT_REPORT, "scanner report malformed")
              return document


          ancestry = {}


          def is_ancestor(ancestor, descendant):
              key = (ancestor, descendant)
              if key in ancestry:
                  return ancestry[key]
              result = git(["-C", ".", "merge-base", "--is-ancestor", ancestor, descendant])
              if result.returncode == 0:
                  value = True
              elif result.returncode == 1:
                  value = False
              else:
                  fail(EXIT_REPORT, "Git ancestry query failed")
              ancestry[key] = value
              return value


          def commit_in_range(commit, base, head):
              if not is_ancestor(commit, head):
                  return False
              if is_ancestor(commit, base):
                  return False
              return True


          entries = {}


          def tree_entry(commit, path):
              # None means the path is absent at this commit. A failed
              # lookup refuses the scan and is never read as absence.
              key = (commit, path)
              if key in entries:
                  return entries[key]
              result = git(["-C", ".", "ls-tree", "-z", commit, "--", path])
              if result.returncode != 0:
                  fail(EXIT_REPORT, "Git ls-tree query failed")
              found = None
              for record in result.stdout.split(b"\0"):
                  if not record:
                      continue
                  meta, sep, name = record.partition(b"\t")
                  fields = meta.split()
                  if not sep or len(fields) < 3:
                      fail(EXIT_REPORT, "Git ls-tree output malformed")
                  try:
                      record_path = name.decode("utf-8")
                  except UnicodeDecodeError:
                      fail(EXIT_REPORT, "Git ls-tree path is not UTF-8")
                  if record_path == path:
                      found = (
                          fields[0],
                          fields[1],
                          fields[2].decode("ascii", "replace"),
                      )
              entries[key] = found
              return found


          contents = {}


          def blob_content(oid):
              if oid in contents:
                  return contents[oid]
              result = git(["-C", ".", "cat-file", "blob", oid])
              if result.returncode != 0:
                  fail(EXIT_REPORT, "Git blob read failed")
              contents[oid] = result.stdout
              return result.stdout


          def blob_lines(oid):
              # Finding coordinates count LF-delimited lines. splitlines()
              # would also break a lone carriage return inside binary
              # content, which would miscount lines.
              data = blob_content(oid)
              if not data:
                  return 0
              count = data.count(b"\n")
              if not data.endswith(b"\n"):
                  count += 1
              return count


          added_cache = {}


          def added_lines(parent, commit, path):
              key = (parent, commit, path)
              if key in added_cache:
                  return added_cache[key]
              result = git([
                  "-C", ".", "diff", "--no-ext-diff", "--no-textconv", "--no-renames",
                  "--text", "--unified=0", "--no-color", parent, commit, "--", path,
              ])
              if result.returncode != 0:
                  fail(EXIT_REPORT, "Git diff query failed")
              lines = result.stdout.split(b"\n")
              # hunks records each validated header as
              # (old_start, old_count, new_start, new_count); spans lists
              # added new-file line numbers. A hunk that only deletes
              # lines is a validated diff with an empty span list, not an
              # empty diff.
              hunks = []
              spans = []
              index = 0
              while index < len(lines):
                  if not lines[index].startswith(b"@@"):
                      index += 1
                      continue
                  match = HUNK.match(lines[index])
                  if not match:
                      fail(EXIT_REPORT, "Git diff hunk header malformed")
                  old_start = int(match.group(1))
                  old_count = int(match.group(2) or b"1")
                  new_start = int(match.group(3))
                  new_count = int(match.group(4) or b"1")
                  index += 1
                  seen_old = 0
                  seen_new = 0
                  while index < len(lines) and not lines[index].startswith(b"@@"):
                      body = lines[index]
                      if body.startswith(b"+"):
                          seen_new += 1
                          spans.append(new_start + seen_new - 1)
                      elif body.startswith(b"-"):
                          seen_old += 1
                      elif body.startswith(b"\\") or body == b"":
                          pass
                      else:
                          fail(EXIT_REPORT, "Git diff body malformed")
                      index += 1
                  if seen_old != old_count or seen_new != new_count:
                      fail(EXIT_REPORT, "Git diff hunk counts do not match")
                  hunks.append((old_start, old_count, new_start, new_count))
              added_cache[key] = (hunks, spans)
              return added_cache[key]


          parents_cache = {}


          def parents_of(commit):
              if commit in parents_cache:
                  return parents_cache[commit]
              result = git(["-C", ".", "rev-list", "--parents", "-n", "1", commit])
              if result.returncode != 0:
                  fail(EXIT_REPORT, "Git parent query failed")
              fields = text(result.stdout).split()
              if not fields or fields[0] != commit:
                  fail(EXIT_REPORT, "Git parent query returned unexpected output")
              parents_cache[commit] = fields[1:]
              return parents_cache[commit]


          def parent_line(hunks, number):
              # Map a new-file line number to its parent line number when
              # the line is unchanged. Return None for a line the diff
              # added. A deletion-only hunk sits after new line
              # new_start, so it shifts every new line above that
              # boundary; a hunk that produced new lines shifts only the
              # lines after its new range.
              old = number
              for old_start, old_count, new_start, new_count in hunks:
                  if new_count == 0:
                      if number > new_start:
                          old += old_count
                  elif new_start <= number < new_start + new_count:
                      return None
                  elif number >= new_start + new_count:
                      old += old_count - new_count
              return old


          def span_contiguous_in_parent(parent_oid, commit_oid, hunks, start, end):
              # Require the whole finding span to map to one contiguous
              # run of unchanged parent lines with identical bytes. A
              # finding that crosses a deleted line maps to parent lines
              # that jump, so it is not inherited even when no line in
              # the span was added.
              parent_lines = blob_content(parent_oid).split(b"\n")
              commit_lines = blob_content(commit_oid).split(b"\n")
              previous = None
              for number in range(start, end + 1):
                  mapped = parent_line(hunks, number)
                  if mapped is None or mapped < 1 or mapped > len(parent_lines):
                      return False
                  if parent_lines[mapped - 1] != commit_lines[number - 1]:
                      return False
                  if previous is not None and mapped != previous + 1:
                      return False
                  previous = mapped
              return True


          def inherited_from(parent, commit, path, start, end):
              # The finding-commit side of every path was already proven
              # to be a regular file before any drop is decided.
              parent_entry = tree_entry(parent, path)
              if parent_entry is None or parent_entry[1] != b"blob":
                  # A parent path that is missing or not a file cannot
                  # prove that the span was inherited unchanged.
                  return False
              # A symlink is still a blob to ls-tree, but it is
              # not a regular file, so it cannot prove that a new regular
              # file's span was inherited. Check the mode before the
              # identical-blob shortcut.
              if parent_entry[0] not in (b"100644", b"100755"):
                  return False
              commit_oid = tree_entry(commit, path)[2]
              if parent_entry[2] == commit_oid:
                  return True
              hunks, spans = added_lines(parent, commit, path)
              if not hunks:
                  fail(EXIT_REPORT, "Git diff is empty for different blobs")
              for line in spans:
                  if start <= line <= end:
                      return False
              contiguous = span_contiguous_in_parent(
                  parent_entry[2], commit_oid, hunks, start, end
              )
              if not contiguous:
                  return False
              return True


          report_path, receipt_path, real_git, base, head = sys.argv[1:6]

          check_receipt(receipt_path)
          document = load_report(report_path)

          raw = len(document)
          inherited = 0
          for entry in document:
              if not isinstance(entry, dict):
                  fail(EXIT_REPORT, "scanner report entry malformed")
              rule = entry.get("RuleID")
              path = entry.get("File")
              start = entry.get("StartLine")
              end = entry.get("EndLine")
              commit = entry.get("Commit")
              if not isinstance(rule, str) or not rule.strip():
                  fail(EXIT_REPORT, "scanner finding is missing a rule")
              if not isinstance(path, str) or not path:
                  fail(EXIT_REPORT, "scanner finding is missing a path")
              if not isinstance(start, int) or not isinstance(end, int):
                  fail(EXIT_REPORT, "scanner finding is missing a line span")
              if isinstance(start, bool) or isinstance(end, bool) or start < 1 or end < start:
                  fail(EXIT_REPORT, "scanner finding line span is invalid")
              if not isinstance(commit, str) or not commit:
                  fail(EXIT_REPORT, "scanner finding is missing a commit")
              # Git reports repository-relative POSIX paths. A colon at
              # offset 1 is a valid filename character, not a host
              # Windows drive, and a leading backslash is a valid POSIX
              # filename byte. Refuse only an absolute path, an empty or
              # dot-dot component, and a NUL byte.
              path_parts = path.split("/")
              if (
                  path.startswith("/")
                  or "\x00" in path
                  or "" in path_parts
                  or ".." in path_parts
              ):
                  fail(EXIT_REPORT, "scanner finding path is not relative")
              if not commit_in_range(commit, base, head):
                  fail(EXIT_REPORT, "scanner finding is outside the scanned range")
              finding_entry = tree_entry(commit, path)
              if finding_entry is None:
                  fail(EXIT_REPORT, "finding path missing at finding commit")
              if finding_entry[1] != b"blob" or finding_entry[0] not in (b"100644", b"100755"):
                  fail(
                      EXIT_REPORT,
                      "finding path is not a regular file at the finding commit",
                  )
              # Prove the coordinates against the finding commit's own
              # blob before any drop, including the identical-blob path.
              if end > blob_lines(finding_entry[2]):
                  fail(EXIT_REPORT, "finding line span is outside the file content")
              drop = False
              parents = parents_of(commit)
              if len(parents) >= 2:
                  for parent in parents:
                      if inherited_from(parent, commit, path, start, end):
                          drop = True
                          break
              if drop:
                  inherited += 1

          effective = raw - inherited
          sys.stdout.write("raw_findings=%d\n" % raw)
          sys.stdout.write("inherited_merge_findings=%d\n" % inherited)
          sys.stdout.write("effective_findings=%d\n" % effective)
          if effective:
              sys.exit(EXIT_CREDENTIAL)
          sys.exit(EXIT_OK)
          PYSCAN
          scan_rc=$?
          set -e

          case "$scan_rc" in
            0)
              echo "result=clean" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "secret scan: no effective findings"
              ;;
            10)
              echo "result=credential" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "::error::A credential was detected in the commits this pull request adds."
              exit 1
              ;;
            2)
              echo "result=tool-error" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "::error::The Git acquisition receipt is missing or incomplete; refusing to read this as a clean scan."
              exit 2
              ;;
            *)
              echo "result=tool-error" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "::error::The scanner report is missing, malformed or contradicted by Git; refusing to read this as a clean scan."
              exit 3
              ;;
          esac

      - name: Explain a failure in terms the author can act on
        # Scoped to credential findings only.  A Git, ruleset or report
        # failure exits the scan with a distinct status and never reaches
        # this message.
        if: failure() && steps.scan.outputs.result == 'credential'
        run: |
          cat <<'MSG'
          ================================================================
          A credential was detected in the commits this pull request adds.

          The value is REDACTED in the log above on purpose. Do not paste it
          into this pull request, an issue, or a chat channel.

          What to do:
            1. Treat the credential as compromised and rotate it now.
            2. Remove the value from the branch. Amend or rewrite the commits
               that carry it -- deleting it in a later commit is not enough,
               because it stays in the branch history.
            3. Report the exposure through your organization's internal
               security process. Do not open a public issue for it.

          This check honors an inline gitleaks:allow marker, so it is not a
          claim of unconditional prevention. If this is a false positive,
          route it through the same internal process rather than disabling
          the check.
          ================================================================
          MSG
          exit 1
